name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; do not cancel in-progress deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Doxygen and Graphviz
        run: sudo apt-get install -y doxygen graphviz

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync

      - name: Build User Docs
        run: uv run sphinx-build -b html docs/source site

      - name: Setup Doxygen configuration
        run: |
          # Build the ModuleGroups.dox file.
          python3 doxygen/make_groups.py

      - name: Build Doxygen
        working-directory: doxygen
        run: doxygen Doxyfile

      - name: Assemble site
        run: |
          mkdir -p site/dev
          cp -r doxygen/html/. site/dev/
          # Prevent GitHub Pages from processing output through Jekyll
          touch site/.nojekyll

      # If this is a commit to main, actually update the real docs...
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

      # If this is a PR, just upload a zip of the docs instead, for local testing.
      - name: Upload HTML Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: site
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
